
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract FLAME CLIENT ZIPs
        run: |
          set -e
          test -f FLAME_CLIENT_v1.6_PART1_PROJECT.zip
          test -f FLAME_CLIENT_v1.6_PART2_LARGE_PACKS.zip
          unzip -o FLAME_CLIENT_v1.6_PART1_PROJECT.zip -d /tmp/flame-part1
          unzip -o FLAME_CLIENT_v1.6_PART2_LARGE_PACKS.zip -d /tmp/flame-part2
          echo "PART 1 and PART 2 extracted."

      - name: Prepare project
        run: |
          set -e
          if [ -f /tmp/flame-part1/gradlew ]; then
            cp -a /tmp/flame-part1/. .
          else
            find /tmp/flame-part1 -name gradlew -type f -print
            echo "Could not find gradlew at expected location."
            exit 1
          fi

      - name: Integrate large packs
        run: |
          set -e
          mkdir -p app/src/main/assets/packs
          find /tmp/flame-part2 -type f \( -name '*.mcpack' -o -name '*.mcaddon' \) \
            -exec cp -f {} app/src/main/assets/packs/ \;
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
