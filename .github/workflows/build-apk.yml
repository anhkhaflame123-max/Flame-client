name: Build FLAME CLIENT APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check repository
    shell: bash
    run: |
      set -e
      echo "Workflow started"
      pwd
      ls -la

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    shell: bash
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract FLAME project parts
    shell: bash
    run: |
      set -euo pipefail

      PART1="FLAME_CLIENT_v2.2_PART1_PROJECT_AND_PACKS.zip"
      PART2="FLAME_CLIENT_v2.2_PART2_LARGE_PACKS.zip"

      if [ -f "$PART1" ] && [ -f "$PART2" ]; then
        unzip -o "$PART1" -d .
        unzip -o "$PART2" -d .
      fi

      if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
        echo "::error::Cannot find settings.gradle or settings.gradle.kts"
        find . -maxdepth 5 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)
        exit 1
      fi

      if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
        echo "::error::Cannot find app Gradle build file"
        exit 1
      fi

  - name: Build APK
    shell: bash
    run: |
      set -euo pipefail
      gradle --version
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FLAME_CLIENT-debug-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
