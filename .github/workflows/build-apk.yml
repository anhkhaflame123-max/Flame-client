name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (Using Runner Built-in SDK)
        shell: bash
        run: |
          echo "Configuring pre-installed Android SDK..."
          
          # Biến môi trường ANDROID_SDK_ROOT đã có sẵn trên GitHub Actions Ubuntu runner
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_ENV
          
          # Thiết lập biến cho phiên làm việc hiện tại
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          # Tự động đồng ý cấp phép license và cài đặt các gói SDK cần thiết
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate FLAME CLIENT project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Gradle project..."
          find . -maxdepth 8 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

          ROOT=""
          while IFS= read -r file; do
            candidate="${file%/*}"
            if { [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; } \
              && [ -f "$candidate/gradlew" ]; then
              ROOT="$candidate"
              break
            fi
          done < <(find . -maxdepth 8 -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [ -z "$ROOT" ]; then
            echo "::error::Could not find a Gradle root with settings file, app module, and Gradle wrapper."
            echo "Check that the project files are committed to the repository."
            exit 1
          fi

          echo "Project root: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the project root."
            exit 1
          fi

          chmod +x gradlew

      - name: Build FLAME CLIENT APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          ./gradlew --no-daemon --version
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No debug APK was found."
            find "$PROJECT_ROOT" -type d -path '*/build/outputs/*' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/FLAME_CLIENT-debug.apk"
          echo "APK prepared: FLAME_CLIENT-debug.apk"

      - name: Upload FLAME CLIENT APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-APK
          path: apk-output/FLAME_CLIENT-debug.apk
          if-no-files-found: error
          retention-days: 7
