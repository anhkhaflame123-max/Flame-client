
name: Build FLAME Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android Command Line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Verify sdkmanager
        run: |
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin"
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate FLAME Launcher project
        run: |
          echo "Searching for Gradle project..."

          find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*"

      - name: Build FLAME Launcher
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug

          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            gradle --no-daemon assembleDebug

          else
            PROJECT_DIR=$(find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Gradle project not found!"
              exit 1
            fi

            cd "$PROJECT_DIR"

            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew --no-daemon assembleDebug
            else
              gradle --no-daemon assembleDebug
            fi
          fi

      - name: Find generated APK
        run: |
          mkdir -p "$RUNNER_TEMP/flame-apk"

          APK_PATH=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found after build!"
            exit 1
          fi

          cp "$APK_PATH" "$RUNNER_TEMP/flame-apk/FLAME_LAUNCHER.apk"

          ls -lh "$RUNNER_TEMP/flame-apk/FLAME_LAUNCHER.apk"

      - name: Upload FLAME Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-LAUNCHER-APK
          path: ${{ runner.temp }}/flame-apk/FLAME_LAUNCHER.apk
          if-no-files-found: error
          retention-days: 14
