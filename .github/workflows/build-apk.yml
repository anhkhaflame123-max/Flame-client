name: Build FLAME CLIENT APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    shell: bash
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Locate FLAME CLIENT project
    shell: bash
    run: |
      set -euo pipefail

      echo "Searching for Gradle project..."
      find . -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      ROOT=""
      while IFS= read -r file; do
        candidate="${file%/*}"
        if [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; then
          ROOT="$candidate"
          break
        fi
      done < <(find . -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \))

      if [ -z "$ROOT" ]; then
        echo "::error::Cannot locate a Gradle root containing settings.gradle and app/build.gradle."
        echo "Check that the FLAME CLIENT project files are committed to the repository."
        exit 1
      fi

      echo "Project root: $ROOT"
      echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

  - name: Build FLAME CLIENT APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_ROOT"

      gradle --no-daemon --version
      gradle --no-daemon assembleDebug

  - name: Find APK
    shell: bash
    run: |
      set -euo pipefail

      APK="$(find "$PROJECT_ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

      if [ -z "$APK" ]; then
        echo "::error::Build finished but no debug APK was found."
        find "$PROJECT_ROOT" -type d -path '*/build/outputs/*' -print
        exit 1
      fi

      mkdir -p "$GITHUB_WORKSPACE/apk-output"
      cp "$APK" "$GITHUB_WORKSPACE/apk-output/FLAME_CLIENT-debug.apk"
      echo "APK found and prepared for upload."

  - name: Upload FLAME CLIENT APK
    uses: actions/upload-artifact@v4
    with:
      name: FLAME_CLIENT-debug-APK
      path: apk-output/FLAME_CLIENT-debug.apk
      if-no-files-found: error
      retention-days: 7
```
