
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/flame-part1 /tmp/flame-part2
          unzip -o FLAME_CLIENT_v1.6_PART1_PROJECT.zip -d /tmp/flame-part1
          unzip -o FLAME_CLIENT_v1.6_PART2_LARGE_PACKS.zip -d /tmp/flame-part2

      - name: Prepare project
        shell: bash
        run: |
          set -e
          PROJECT_FILE=$(find /tmp/flame-part1 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Cannot find settings.gradle"
            find /tmp/flame-part1 -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cp -a "$PROJECT_DIR"/. .
          echo "Project prepared from: $PROJECT_DIR"
          test -f app/build.gradle.kts

      - name: Add large packs
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets/packs
          find /tmp/flame-part2 -type f \( -name '*.mcpack' -o -name '*.mcaddon' \) \
            -exec cp -f {} app/src/main/assets/packs/ \;

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
