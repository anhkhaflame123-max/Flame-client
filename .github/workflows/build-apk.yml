
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find FLAME CLIENT source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "FLAME_PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Cannot find Android source or ZIP file."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          mkdir -p _flame_source
          unzip -oq "$ZIP_FILE" -d _flame_source

          SETTINGS_FILE="$(find _flame_source -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP."
            find _flame_source -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "FLAME_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$FLAME_PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            echo "ERROR: gradlew is missing. This project needs its matching Gradle wrapper."
            exit 1
          fi

      - name: Collect APK for download
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          APK_PATH="$(find "$FLAME_PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -size +0c -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was generated."
            find "$FLAME_PROJECT_DIR" -type d -path '*/build/outputs*' -print || true
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/artifact/FLAME_CLIENT-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/artifact/FLAME_CLIENT-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-apk
          path: artifact/FLAME_CLIENT-debug.apk
          if-no-files-found: error
          retention-days: 7