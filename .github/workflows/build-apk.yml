
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build FLAME CLIENT
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            ROOT="."
          else
            ROOT="$(find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './_flame_extract/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$ROOT" ] || [ ! -d "$ROOT/app" ]; then
            echo "ERROR: Không tìm thấy thư mục Gradle chứa app/."
            echo "Danh sách file hiện có:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Gradle project: $ROOT"
          echo "GRADLE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRADLE_ROOT"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7