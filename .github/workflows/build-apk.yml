
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK: $SDK"

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy ZIP mã nguồn ở thư mục gốc."
            ls -la
            exit 1
          fi

          echo "Found source: $ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \( -name settings.gradle.kts \
            -o -name settings.gradle \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::ZIP không chứa settings.gradle hoặc settings.gradle.kts."
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 4 -type f | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Không tìm thấy thư mục app trong dự án."
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build FLAME CLIENT APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon assembleDebug

      - name: Find APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7