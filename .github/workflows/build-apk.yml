
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy file ZIP trong repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -o "$ZIP" -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::ZIP không có gradlew. Cần kiểm tra và bổ sung Gradle Wrapper."
            exit 1
          fi

          DIR="$(dirname "$WRAPPER")"
          DIR="$(realpath "$DIR")"

          if [ ! -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Thiếu gradle-wrapper.properties."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7