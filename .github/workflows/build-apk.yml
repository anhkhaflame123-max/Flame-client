name: Build FLAME CLIENT APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Step 1 - Checkout repository
    uses: actions/checkout@v4

  - name: Step 2 - Check repository files
    shell: bash
    run: |
      set -euxo pipefail
      echo "Current directory:"
      pwd
      echo "Repository files:"
      ls -la
      echo "Checking ZIP files..."

      test -f FLAME_CLIENT_v2.2_PART1_PROJECT_AND_PACKS.zip
      test -f FLAME_CLIENT_v2.2_PART2_LARGE_PACKS.zip

  - name: Step 3 - Extract project ZIP files
    shell: bash
    run: |
      set -euo pipefail

      unzip -o FLAME_CLIENT_v2.2_PART1_PROJECT_AND_PACKS.zip -d .
      unzip -o FLAME_CLIENT_v2.2_PART2_LARGE_PACKS.zip -d .

      if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
        echo "::error::Gradle settings file not found in repository root"
        find . -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)
        exit 1
      fi

      if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
        echo "::error::App Gradle file not found"
        find . -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \)
        exit 1
      fi

      echo "Project files found successfully."

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    shell: bash
    run: |
      set -euo pipefail
      gradle --version
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FLAME_CLIENT-debug-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
```
