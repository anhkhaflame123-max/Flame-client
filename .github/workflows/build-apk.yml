
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "Java version:"
          java -version
          echo "Android SDK: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Cannot find Android sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate FLAME CLIENT source
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            if [ -d app ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            mkdir -p "$RUNNER_TEMP/flame-source"
            while IFS= read -r -d '' ZIPFILE; do
              echo "Extracting: $ZIPFILE"
              unzip -oq "$ZIPFILE" -d "$RUNNER_TEMP/flame-source"
            done < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print0)

            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"
              if [ -d "$DIR/app" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(
              find "$RUNNER_TEMP/flame-source" \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print0
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find an Android project containing settings.gradle and app/"
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -200
            echo "Extracted files:"
            find "$RUNNER_TEMP/flame-source" -maxdepth 4 -type f 2>/dev/null | head -200
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"
          echo "FLAME_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project files:"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Build FLAME CLIENT APK
        shell: bash
        run: |
          set -e
          cd "$FLAME_PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          find "$FLAME_PROJECT_DIR" -type f -name '*.apk' -print
          if ! find "$FLAME_PROJECT_DIR" -type f -name '*.apk' | grep -q .; then
            echo "::error::Build finished but no APK was found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7