
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Không tìm thấy settings.gradle hoặc settings.gradle.kts"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"

          if [ ! -d "$ROOT/app" ]; then
            echo "ERROR: Không tìm thấy thư mục app trong $ROOT"
            ls -la "$ROOT"
            exit 1
          fi

          if [ ! -f "$ROOT/app/build.gradle" ] && \
             [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: Thiếu app/build.gradle hoặc app/build.gradle.kts"
            exit 1
          fi

          echo "GRADLE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Đã tìm thấy project: $ROOT"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRADLE_ROOT"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7