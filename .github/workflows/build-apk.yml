
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Inspect project
        shell: bash
        run: |
          echo "===== ROOT DIRECTORY ====="
          pwd
          ls -la

          echo "===== GRADLE FILES ====="
          find . -maxdepth 8 -type f \( \
            -name gradlew -o \
            -name gradle-wrapper.properties -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          WRAPPER="$(find . -maxdepth 8 -type f \
            -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Không tìm thấy gradlew. Source project có thể thiếu hoặc nằm sai thư mục."
            exit 1
          fi

          DIR="$(dirname "$WRAPPER")"
          DIR="$(realpath "$DIR")"

          if [ ! -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Thiếu gradle/wrapper/gradle-wrapper.properties."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"
          cat "$DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          java -version
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Find and prepare APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact"

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            ! -path '*/androidTest/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Build kết thúc nhưng không tìm thấy file APK."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/artifact/FLAME_CLIENT-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/artifact/FLAME_CLIENT-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-apk
          path: artifact/FLAME_CLIENT-debug.apk
          if-no-files-found: error
          retention-days: 7