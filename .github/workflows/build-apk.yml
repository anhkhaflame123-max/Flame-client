
name: Build FLAME Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools"
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35"
          sdkmanager --sdk_root="$ANDROID_HOME" "build-tools;35.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project
        run: |
          echo "Checking project files..."
          ls -la
          find . -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build FLAME Launcher
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload FLAME Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-Launcher-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
