name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract ZIP project and packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
            -not -path '*/extracted/*' -print0 |
          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            dest="$GITHUB_WORKSPACE/extracted/$(basename "${zipfile%.zip}")"
            mkdir -p "$dest"
            unzip -oq "$zipfile" -d "$dest"
          done
          echo "Files after extraction:"
          find "$GITHUB_WORKSPACE" -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Locate FLAME CLIENT project
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          
