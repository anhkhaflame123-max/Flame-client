
name: Build FLAME Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android Command Line Tools
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find FLAME Launcher ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            ! -name "commandlinetools.zip" \
            -print | while read FILE; do
              if unzip -Z1 "$FILE" 2>/dev/null | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
                echo "$FILE"
                break
              fi
            done)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP containing a Gradle project was found."
            echo "ZIP files in repository:"
            find "$GITHUB_WORKSPACE" -type f -iname "*.zip"
            exit 1
          fi

          echo "Found project ZIP: $ZIP"
          echo "FLAME_SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract FLAME Launcher source
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/flame-project"

          unzip -oq "$FLAME_SOURCE_ZIP" \
            -d "$RUNNER_TEMP/flame-project"

          echo "Extracted source:"
          find "$RUNNER_TEMP/flame-project" -maxdepth 4 -type f | head -100

      - name: Locate Gradle root
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/flame-project"

          SETTINGS=$(find "$ROOT" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "FLAME_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle root: $PROJECT_DIR"

      - name: Build FLAME Launcher APK
        shell: bash
        run: |
          set -e

          cd "$FLAME_PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK=$(find "$FLAME_PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp "$APK" "$GITHUB_WORKSPACE/artifact/FLAME_LAUNCHER.apk"

          ls -lh "$GITHUB_WORKSPACE/artifact/FLAME_LAUNCHER.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-LAUNCHER-APK
          path: artifact/FLAME_LAUNCHER.apk
          if-no-files-found: error
          retention-days: 14
