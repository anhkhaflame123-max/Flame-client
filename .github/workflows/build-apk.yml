
name: FLAME CLIENT - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK manually
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK"

          echo "Checking SDK manager..."
          ls "$SDK/cmdline-tools/16.0/bin/"

          echo "Installing required Android packages..."
          "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses || true

      - name: Install Gradle 8.9
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Reconstruct FLAME source
        run: |
          set -e

          mkdir -p reconstructed/source

          cat \
            FLAME_CLIENT_BUILD_PART1.bin \
            FLAME_CLIENT_BUILD_PART2.bin \
            FLAME_CLIENT_BUILD_PART3.bin \
            FLAME_CLIENT_BUILD_PART4.bin \
            > reconstructed/FLAME_SOURCE.zip

          unzip -t reconstructed/FLAME_SOURCE.zip

          unzip -oq reconstructed/FLAME_SOURCE.zip \
            -d reconstructed/source

      - name: Locate Gradle project
        run: |
          set -e

          SOURCE="$GITHUB_WORKSPACE/reconstructed/source"

          SETTINGS=$(find "$SOURCE" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Cannot find settings.gradle"
            find "$SOURCE" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS")"

          echo "Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Build FLAME APK
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Collect APK
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_ROOT" \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
