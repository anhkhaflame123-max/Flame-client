name: Build FLAME CLIENT APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Test workflow
    run: |
      echo "Workflow started successfully"
      pwd
      ls -la

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Locate Gradle project
    shell: bash
    run: |
      set -euo pipefail
      echo "Searching for Gradle files..."
      find . -maxdepth 5 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)
      find . -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \)
      if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
        echo "::error::Gradle settings file missing from repository root"
        exit 1
      fi
      if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
        echo "::error::App Gradle build file missing"
        exit 1
      fi

  - name: Build debug APK
    run: gradle --no-daemon assembleDebug

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: FLAME_CLIENT-debug-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
```
