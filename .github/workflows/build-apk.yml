
name: Build FLAME CLIENT v2.3 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build FLAME CLIENT v2.3
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Giữ nguyên các gói Android SDK
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate FLAME CLIENT v2.3 project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          TEMP="$ROOT/_flame_v23"
          PART1="$ROOT/FLAME_CLIENT_v2.3_PART1_PROJECT.zip"
          PART2="$ROOT/FLAME_CLIENT_v2.3_PART2_LARGE_PACKS.zip"
          FULL="$ROOT/FLAME_CLIENT_v2.3_FLAME_REWORK.zip"

          rm -rf "$TEMP"
          mkdir -p "$TEMP/part1" "$TEMP/part2"

          if [ -f "$FULL" ]; then
            echo "Found full project ZIP"
            unzip -oq "$FULL" -d "$TEMP/part1"
          elif [ -f "$PART1" ] && [ -f "$PART2" ]; then
            echo "Extracting PART 1 and PART 2"
            unzip -oq "$PART1" -d "$TEMP/part1"
            unzip -oq "$PART2" -d "$TEMP/part2"
          else
            echo "ERROR: Required ZIP file(s) not found in repository root"
            ls -lah "$ROOT"
            exit 1
          fi

          echo "Searching for Gradle project root..."
          SETTINGS="$(find "$TEMP/part1" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found in PART 1"
            echo "PART 1 file listing:"
            find "$TEMP/part1" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          echo "Detected project: $PROJECT"

          if [ ! -d "$PROJECT/app" ]; then
            echo "ERROR: app/ folder missing beside Gradle settings"
            find "$PROJECT" -maxdepth 3 -type d | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found"
            find "$PROJECT" -maxdepth 3 -type f | head -150
            exit 1
          fi

          echo "Copying project into repository root..."
          cp -a "$PROJECT"/. "$ROOT"/

          echo "PART 2 contents:"
          find "$TEMP/part2" -maxdepth 5 -type d | head -100

          echo "Project location step completed."

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file not found at repository root"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: App Gradle build file not found"
            exit 1
          fi

          echo "Gradle settings and app build file found."
          ls -la
          ls -la app

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated at expected path"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p artifact
          cp "$APK" artifact/FLAME_CLIENT-v2.3-debug.apk
          sha256sum artifact/FLAME_CLIENT-v2.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-v2.3-debug-apk
          path: artifact/FLAME_CLIENT-v2.3-debug.apk
          if-no-files-found: error
          retention-days: 14
