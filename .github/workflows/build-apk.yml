name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP" ]; then
              echo "::error::Không tìm thấy settings.gradle.kts hoặc ZIP dự án."
              exit 1
            fi
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
            ROOT="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
            if [ -z "$ROOT" ]; then
              echo "::error::ZIP không chứa dự án Gradle hợp lệ."
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$ROOT")" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7