
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || {
            echo "::error::Android SDK not found"
            exit 1
          }
          ls "$ANDROID_HOME"

      - name: Locate project
        shell: bash
        run: |
          set -eu
          ROOT="$GITHUB_WORKSPACE"

          echo "=== Gradle files found ==="
          find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' -print

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Cannot find Gradle project root."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7