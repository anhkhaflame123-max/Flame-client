
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract FLAME CLIENT ZIPs
        run: |
          set -e
          test -f FLAME_CLIENT_v1.6_PART1_PROJECT.zip
          test -f FLAME_CLIENT_v1.6_PART2_LARGE_PACKS.zip
          unzip -o FLAME_CLIENT_v1.6_PART1_PROJECT.zip -d /tmp/flame-part1
          unzip -o FLAME_CLIENT_v1.6_PART2_LARGE_PACKS.zip -d /tmp/flame-part2
          echo "PART 1 and PART 2 extracted."

 
      - name: Prepare project
        shell: bash
        run: |
          set -e
          PROJECT_FILE=$(find /tmp/flame-part1 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Cannot find Gradle project."
            find /tmp/flame-part1 -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Project directory: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
