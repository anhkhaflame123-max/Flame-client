
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "./app/gradlew" ]; then
            echo "PROJECT_DIR=app" >> "$GITHUB_ENV"
          else
            echo "ERROR: Cannot find gradlew."
            echo "Upload the Android project source, including gradlew."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build FLAME CLIENT APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p artifact
          APK_PATH="$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" artifact/FLAME_CLIENT-debug.apk
          ls -lh artifact/

      - name: Upload FLAME CLIENT APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-apk
          path: artifact/FLAME_CLIENT-debug.apk
          if-no-files-found: error
          retention-days: 7