
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build FLAME CLIENT
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project and build APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          ls -la

          SETTINGS=""

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            SETTINGS="./settings.gradle"
            [ -f settings.gradle ] || SETTINGS="./settings.gradle.kts"
          else
            SETTINGS="$(find . \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path '*/build/*' \
              -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Không tìm thấy settings.gradle(.kts)."
            echo "Repo có thể chưa chứa source project Android."
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          echo "Gradle root: $ROOT"

          if [ ! -d "$ROOT/app" ]; then
            echo "ERROR: Không có thư mục app/ tại $ROOT"
            ls -la "$ROOT"
            exit 1
          fi

          if [ ! -f "$ROOT/app/build.gradle" ] && \
             [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: Thiếu file build Gradle của app."
            exit 1
          fi

          cd "$ROOT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build không tạo ra APK."
            exit 1
          fi

          echo "APK_PATH=$ROOT/$APK" >> "$GITHUB_ENV"
          echo "Build APK thành công: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7