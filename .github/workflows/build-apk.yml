
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project and extract ZIP files
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/flame_extract"
          mkdir -p "$EXTRACT"

          echo "Repository contents:"
          find "$WORK" -maxdepth 3 -type f | head -200

          # Extract project and pack ZIP files without modifying originals.
          while IFS= read -r -d '' archive; do
            echo "Extracting: $archive"
            target="$EXTRACT/$(basename "$archive" .zip)"
            mkdir -p "$target"
            unzip -oq "$archive" -d "$target"
          done < <(
            find "$WORK" -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

          # Search extracted ZIPs first, then the repository.
          PROJECT_ROOT=""

          for base in "$EXTRACT" "$WORK"; do
            while IFS= read -r -d '' settings; do
              candidate="$(dirname "$settings")"

              if [ -d "$candidate/app" ] &&
                 { [ -f "$candidate/app/build.gradle" ] ||
                   [ -f "$candidate/app/build.gradle.kts" ]; }; then
                PROJECT_ROOT="$candidate"
                break 2
              fi
            done < <(
              find "$base" \
                \( -path '*/.git' -o -path '*/.github' -o \
                   -path '*/build' -o -path '*/.gradle' \) -prune -o \
                \( -name settings.gradle -o \
                   -name settings.gradle.kts \) \
                -type f -print0 2>/dev/null
            )
          done

          # Fallback: find a root-level Android app build file.
          if [ -z "$PROJECT_ROOT" ]; then
            for base in "$EXTRACT" "$WORK"; do
              app_build="$(
                find "$base" \
                  \( -path '*/.git' -o -path '*/.github' -o \
                     -path '*/build' -o -path '*/.gradle' \) -prune -o \
                  \( -path '*/app/build.gradle' -o \
                     -path '*/app/build.gradle.kts' \) \
                  -type f -print -quit 2>/dev/null || true
              )"

              if [ -n "$app_build" ]; then
                PROJECT_ROOT="$(dirname "$(dirname "$app_build")")"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Cannot find Android Gradle project."
            echo "Expected settings.gradle(.kts) and app/build.gradle(.kts)."
            echo "Check whether the ZIP files contain the actual project."
            exit 1
          fi

          echo "Project root found: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root files:"
          ls -la "$PROJECT_ROOT"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          echo "Building from: $(pwd)"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."
          find "$PROJECT_ROOT" -type f -name '*.apk' -print

          APK="$(find "$PROJECT_ROOT" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Build completed but no debug APK was found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7