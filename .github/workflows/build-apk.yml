
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GIỮ NGUYÊN PHẦN SDK CỦA BẠN Ở ĐÂY
      # Đặt nguyên bước cài SDK hiện tại của bạn tại vị trí này.

      - name: Locate and extract FLAME project
        shell: bash
        run: |
          set -e

          echo "=== Files in repository ==="
          find . -maxdepth 3 -type f | sort | head -200

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f \
            -name 'FLAME_CLIENT_v2.3_PART1_PROJECT.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy FLAME_CLIENT_v2.3_PART1_PROJECT.zip"
            exit 1
          fi

          PROJECT_PARENT="$RUNNER_TEMP/flame_project"
          mkdir -p "$PROJECT_PARENT"

          echo "=== Extracting project ZIP ==="
          unzip -o "$ZIP_FILE" -d "$PROJECT_PARENT"

          echo "=== Searching for Gradle settings ==="
          SETTINGS_FILE="$(find "$PROJECT_PARENT" -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Không tìm thấy settings.gradle hoặc settings.gradle.kts trong ZIP PART1"
            echo "Kiểm tra lại cấu trúc file ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Project root contents ==="
          ls -la "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Không tìm thấy thư mục app trong Gradle project root"
            exit 1
          fi

      - name: Locate Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Không tìm thấy gradlew trong thư mục dự án."
            echo "ZIP có thể thiếu Gradle Wrapper; cần kiểm tra cấu trúc dự án trước khi build."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error