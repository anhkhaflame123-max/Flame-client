
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project and JVM targets
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -n "VERSION_17\|jvmTarget\|jvmToolchain" app/build.gradle.kts
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Locate APK files
        id: apk
        shell: bash
        run: |
          echo "APK files generated by Gradle:"
          find . -type f -path '*/build/outputs/apk/*/*.apk' -print
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -size +0c -print -quit)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find . -type f -path '*/build/outputs/apk/*/*.apk' -size +0c -print -quit)"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK was generated. Build output folders:"
            find . -type d -path '*/build/outputs*' -print
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-apk
          path: '**/*.apk'
          if-no-files-found: error
          retention-days: 7