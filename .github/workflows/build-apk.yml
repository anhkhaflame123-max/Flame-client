
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FLAME CLIENT project
        shell: bash
        run: |
          set -e

          PROJECT_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 2 \
            -type f -name 'FLAME_CLIENT_v2.3_PART1_PROJECT.zip' \
            -print -quit)"

          if [ -z "$PROJECT_ZIP" ]; then
            echo "::error::Không tìm thấy file PART1_PROJECT.zip."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flame_project"
          unzip -oq "$PROJECT_ZIP" -d "$RUNNER_TEMP/flame_project"

          echo "PROJECT_DIR=$RUNNER_TEMP/flame_project" >> "$GITHUB_ENV"

          echo "=== Đã giải nén dự án ==="
          find "$RUNNER_TEMP/flame_project" -maxdepth 3 -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradlew' \) -print

      # GIỮ NGUYÊN BƯỚC CÀI ĐẶT ANDROID SDK HIỆN TẠI Ở ĐÂY

      - name: Locate Gradle Wrapper
        shell: bash
        run: |
          set -e

          echo "=== Tìm gradlew trong toàn bộ dự án ==="
          WRAPPER="$(find "$PROJECT_DIR" -type f -name 'gradlew' -print -quit)"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            chmod +x "$WRAPPER"
            echo "Đã tìm thấy Gradle Wrapper: $WRAPPER"
          else
            echo "::error::Không tìm thấy gradlew trong ZIP."
            echo "=== Các file Gradle tìm thấy ==="
            find "$PROJECT_DIR" -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
              -o -name 'gradle-wrapper.properties' \) -print
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error