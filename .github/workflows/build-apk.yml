
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi
          ls "$ANDROID_HOME"

      - name: Locate project
        shell: bash
        run: |
          set -eu
          ROOT="$GITHUB_WORKSPACE"

          echo "=== Workspace directories ==="
          find "$ROOT" -maxdepth 5 -type d \
            -not -path '*/.git*' \
            -not -path '*/.gradle*' -print

          echo "=== Gradle build files ==="
          find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' -print

          SETTINGS="$(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            BUILD_FILE="$(find "$ROOT" -type f \
              \( -name build.gradle \
              -o -name build.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit)"

            if [ -z "$BUILD_FILE" ]; then
              echo "::error::No Gradle build files found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7