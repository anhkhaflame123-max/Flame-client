
name: Build FLAME Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find valid FLAME Android project ZIP
        shell: bash
        run: |
          set -e

          FOUND=""

          while IFS= read -r ZIP; do
            echo "Checking: $ZIP"

            if ! unzip -tq "$ZIP" >/dev/null 2>&1; then
              echo "Invalid ZIP, skipping."
              continue
            fi

            if unzip -Z1 "$ZIP" 2>/dev/null |
               grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              FOUND="$ZIP"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "*/.git/*"
          )

          if [ -z "$FOUND" ]; then
            echo "ERROR: No complete Android Gradle project ZIP found."
            echo "ZIP files available:"
            find "$GITHUB_WORKSPACE" -type f -iname "*.zip"
            exit 1
          fi

          echo "Selected project: $FOUND"
          echo "FLAME_SOURCE_ZIP=$FOUND" >> "$GITHUB_ENV"

      - name: Extract FLAME project
        shell: bash
        run: |
          set -e

          DEST="$RUNNER_TEMP/flame-source"

          mkdir -p "$DEST"

          unzip -oq "$FLAME_SOURCE_ZIP" -d "$DEST"

          echo "Extracted project files:"
          find "$DEST" -maxdepth 4 -type f | head -100

      - name: Detect Gradle root
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/flame-source"

          SETTINGS=$(find "$ROOT" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file missing."
            find "$ROOT" -maxdepth 5 -type d
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found."
            find "$PROJECT" -maxdepth 4 -type f
            exit 1
          fi

          echo "FLAME_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Gradle root: $PROJECT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$FLAME_PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$FLAME_PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but APK was not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp "$APK" "$GITHUB_WORKSPACE/artifact/FLAME_LAUNCHER.apk"

          ls -lh "$GITHUB_WORKSPACE/artifact/FLAME_LAUNCHER.apk"

      - name: Upload FLAME Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-LAUNCHER-APK
          path: artifact/FLAME_LAUNCHER.apk
          if-no-files-found: error
          retention-days: 14
