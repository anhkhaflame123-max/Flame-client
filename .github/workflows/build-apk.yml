
name: Build FLAME CLIENT v3.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build FLAME CLIENT v3.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found: $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Select source and merge BOTH project and large-pack ZIPs
        shell: bash
        run: |
          set -euo pipefail
          WS="$GITHUB_WORKSPACE"
          STAGE="$WS/.flame_source_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/part1" "$STAGE/part2" "$STAGE/source"

          PART1="$(find "$WS" -type d \( -name .git -o -path "$STAGE" \) -prune -o -type f -name 'FLAME_CLIENT_v3.0_PART1_PROJECT*.zip' -print | sort | head -n 1 || true)"
          PART2="$(find "$WS" -type d \( -name .git -o -path "$STAGE" \) -prune -o -type f -name 'FLAME_CLIENT_v3.0_PART2_LARGE_PACKS*.zip' -print | sort | head -n 1 || true)"

          if [ -z "$PART1" ] || [ -z "$PART2" ]; then
            echo "ERROR: Required v3.0 ZIPs were not both found."
            echo "Expected: FLAME_CLIENT_v3.0_PART1_PROJECT.zip and FLAME_CLIENT_v3.0_PART2_LARGE_PACKS.zip"
            find "$WS" -maxdepth 2 -type f -printf '%P (%s bytes)\n' | sort
            exit 1
          fi

          echo "Project ZIP: $PART1"
          echo "Large packs ZIP: $PART2"
          unzip -tq "$PART1"
          unzip -tq "$PART2"
          unzip -oq "$PART1" -d "$STAGE/part1"
          unzip -oq "$PART2" -d "$STAGE/part2"

          PROJECT_ROOT=""
          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if { [ -f "$CANDIDATE/settings.gradle.kts" ] || [ -f "$CANDIDATE/settings.gradle" ]; } &&
               { [ -f "$CANDIDATE/app/build.gradle.kts" ] || [ -f "$CANDIDATE/app/build.gradle" ]; } &&
               [ -f "$CANDIDATE/app/src/main/java/com/flameclient/android/MainActivity.kt" ]; then
              PROJECT_GRADLE="$CANDIDATE/app/build.gradle.kts"
              [ -f "$PROJECT_GRADLE" ] || PROJECT_GRADLE="$CANDIDATE/app/build.gradle"
              if grep -q 'versionName = "3.0"' "$PROJECT_GRADLE" && grep -q 'versionCode = 10' "$PROJECT_GRADLE"; then
                PROJECT_ROOT="$CANDIDATE"
                break
              fi
            fi
          done < <(find "$STAGE/part1" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print | sort)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: No valid v3.0 Gradle project found in Part 1."
            find "$STAGE/part1" -maxdepth 8 -type f -print | head -120 || true
            exit 1
          fi
          echo "Project root: $PROJECT_ROOT"

          PACK_DIR="$(find "$STAGE/part2" -type d -path '*/app/src/main/assets/packs' -print -quit || true)"
          if [ -z "$PACK_DIR" ]; then
            echo "ERROR: Part 2 does not contain app/src/main/assets/packs."
            find "$STAGE/part2" -maxdepth 8 -type f -print | head -120 || true
            exit 1
          fi
          if ! find "$PACK_DIR" -type f -print -quit | grep -q .; then
            echo "ERROR: Part 2 pack directory is empty."
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. "$STAGE/source"/
          mkdir -p "$STAGE/source/app/src/main/assets/packs"
          cp -a "$PACK_DIR"/. "$STAGE/source/app/src/main/assets/packs"/
          cp -a "$STAGE/source"/. "$WS"/

          APP_GRADLE="app/build.gradle.kts"
          [ -f "$APP_GRADLE" ] || APP_GRADLE="app/build.gradle"
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/src/main/java/com/flameclient/android/MainActivity.kt
          grep -q 'versionName = "3.0"' "$APP_GRADLE"
          grep -q 'versionCode = 10' "$APP_GRADLE"

          PACK_COUNT="$(find app/src/main/assets/packs -type f | wc -l | tr -d ' ')"
          if [ "$PACK_COUNT" -lt 1 ]; then
            echo "ERROR: No pack files after merge."
            exit 1
          fi
          echo "FLAME_PACK_FILE_COUNT=$PACK_COUNT" >> "$GITHUB_ENV"
          echo "Merged source ready: $PACK_COUNT pack files."

          if [ -f scripts/verify_source.py ]; then
            python3 scripts/verify_source.py
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and packs
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK was not produced."
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          APK_PACK_COUNT="$(unzip -Z1 "$APK_PATH" | grep -c '^assets/packs/' || true)"
          if [ "$APK_PACK_COUNT" -lt "$FLAME_PACK_FILE_COUNT" ]; then
            echo "ERROR: Source has $FLAME_PACK_FILE_COUNT pack files, APK has $APK_PACK_COUNT."
            exit 1
          fi

          mkdir -p artifact
          cp "$APK_PATH" artifact/FLAME_CLIENT-v3.0-debug.apk
          du -h artifact/FLAME_CLIENT-v3.0-debug.apk
          sha256sum artifact/FLAME_CLIENT-v3.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-v3.0-debug-apk
          path: artifact/FLAME_CLIENT-v3.0-debug.apk
          if-no-files-found: error
          retention-days: 14
