
name: Build FLAME Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Command Line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          ls "$ANDROID_HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find FLAME Launcher project
        run: |
          echo "Searching for Gradle project..."
          find . -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "FLAME_LAUNCHER/gradlew" ]; then
            cd FLAME_LAUNCHER
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew not found!"
            echo "Please check the FLAME Launcher project ZIP."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-Launcher-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
