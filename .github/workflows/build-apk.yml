
      - name: Locate project
        id: locate
        shell: bash
        run: |
          set -eu

          echo "=== Repository root ==="
          pwd
          ls -la "$GITHUB_WORKSPACE"

          echo "=== Searching Gradle project files ==="
          find "$GITHUB_WORKSPACE" \
            -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
            -type f \( \
              -name settings.gradle \
              -o -name settings.gradle.kts \
            \) -print

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
            -type f \( \
              -name settings.gradle \
              -o -name settings.gradle.kts \
            \) -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found."
            echo "=== Build files found ==="
            find "$GITHUB_WORKSPACE" \
              -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
              -type f \( \
                -name build.gradle \
                -o -name build.gradle.kts \
                -o -name gradlew \
              \) -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Selected project directory ==="
          echo "$PROJECT_DIR"
          ls -la "$PROJECT_DIR"