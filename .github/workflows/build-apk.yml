
      - name: Locate FLAME CLIENT v2.3 project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          TEMP="$ROOT/_flame_v23"

          PART1="$ROOT/FLAME_CLIENT_v2.3_PART1_PROJECT.zip"
          PART2="$ROOT/FLAME_CLIENT_v2.3_PART2_LARGE_PACKS.zip"
          FULL="$ROOT/FLAME_CLIENT_v2.3_FLAME_REWORK.zip"

          rm -rf "$TEMP"
          mkdir -p "$TEMP/part1" "$TEMP/part2" "$TEMP/merged"

          if [ -f "$FULL" ]; then
            echo "Found full project ZIP"
            unzip -oq "$FULL" -d "$TEMP/part1"
          elif [ -f "$PART1" ] && [ -f "$PART2" ]; then
            echo "Found both project ZIP parts"
            unzip -oq "$PART1" -d "$TEMP/part1"
            unzip -oq "$PART2" -d "$TEMP/part2"
          else
            echo "ERROR: Missing required ZIP files."
            find "$ROOT" -maxdepth 3 -type f -printf '%P\n' | head -200
            exit 1
          fi

          echo "=== Search for Gradle settings ==="

          SETTINGS="$(find "$TEMP/part1" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle(.kts) found in PART 1."
            find "$TEMP/part1" -maxdepth 7 -print | head -300
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          echo "Detected project root: $PROJECT"

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle build file not found beside settings."
            find "$PROJECT" -maxdepth 6 -print | head -300
            exit 1
          fi

          cp -a "$PROJECT"/. "$TEMP/merged"/

          echo "=== Merge PART 2 files without replacing existing project files ==="

          if [ -d "$TEMP/part2" ]; then
            PART2_SETTINGS="$(find "$TEMP/part2" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -print -quit || true)"

            if [ -n "$PART2_SETTINGS" ]; then
              PART2_ROOT="$(dirname "$PART2_SETTINGS")"
            else
              PART2_ROOT="$TEMP/part2"
            fi

            cp -an "$PART2_ROOT"/. "$TEMP/merged"/
          fi

          echo "=== Validate merged project ==="

          if [ ! -f "$TEMP/merged/settings.gradle" ] && \
             [ ! -f "$TEMP/merged/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings missing after merge."
            find "$TEMP/merged" -maxdepth 5 -print | head -300
            exit 1
          fi

          if [ ! -d "$TEMP/merged/app" ]; then
            echo "ERROR: app directory missing after merge."
            find "$TEMP/merged" -maxdepth 6 -print | head -300
            exit 1
          fi

          if [ ! -f "$TEMP/merged/app/build.gradle" ] && \
             [ ! -f "$TEMP/merged/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle(.kts) missing after merge."
            find "$TEMP/merged/app" -maxdepth 6 -print | head -300
            exit 1
          fi

          cp -an "$TEMP/merged"/. "$ROOT"/

          echo "=== Final Gradle project ==="
          ls -la "$ROOT"
          ls -la "$ROOT/app"

          echo "Project root located successfully."