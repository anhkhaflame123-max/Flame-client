
name: FLAME CLIENT - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: 16.0
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH
          gradle --version

      - name: Reconstruct FLAME source
        run: |
          set -e

          mkdir -p reconstructed

          cat \
            FLAME_CLIENT_BUILD_PART1.bin \
            FLAME_CLIENT_BUILD_PART2.bin \
            FLAME_CLIENT_BUILD_PART3.bin \
            FLAME_CLIENT_BUILD_PART4.bin \
            > reconstructed/FLAME_SOURCE.zip

          echo "Checking ZIP integrity..."
          unzip -t reconstructed/FLAME_SOURCE.zip

          mkdir -p reconstructed/source

          unzip -oq reconstructed/FLAME_SOURCE.zip \
            -d reconstructed/source

      - name: Locate Gradle project
        run: |
          set -e

          SOURCE="$GITHUB_WORKSPACE/reconstructed/source"

          SETTINGS=$(find "$SOURCE" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Cannot find settings.gradle"
            find "$SOURCE" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Gradle project found:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Build FLAME Debug APK
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Collect APK
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_ROOT" \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          echo "APK files:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload FLAME APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-CLIENT-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
