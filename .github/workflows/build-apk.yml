name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate FLAME CLIENT project
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          while IFS= read -r -d '' file; do
            candidate="${file%/*}"
            if [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; then
              ROOT="$candidate"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 8 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [ -z "$ROOT" ]; then
            echo "::error::Cannot find Gradle project root with an app module."
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle wrapper files are missing."
            exit 1
          fi
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build FLAME CLIENT APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew --no-daemon assembleDebug

      - name: Find and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ]; then
            echo "::error::APK not found after build."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/FLAME_CLIENT-debug.apk"

      - name: Upload FLAME CLIENT APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-APK
          path: apk-output/FLAME_CLIENT-debug.apk
          if-no-files-found: error
          retention-days: 7
