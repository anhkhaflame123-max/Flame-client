
name: Build FLAME Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK environment
        shell: bash
        run: |
          SDK="$HOME/android-sdk"

          mkdir -p "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Download Android SDK command-line tools
        shell: bash
        run: |
          set -e

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools/latest"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-tools.zip

          unzip -q android-tools.zip

          mv cmdline-tools/* "$SDK/cmdline-tools/latest/"

          echo "Android SDK tools installed."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/android-sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Assemble FLAME source from 4 parts
        shell: bash
        run: |
          set -e

          PART1="FLAME_CLIENT_BUILD_PART1.bin"
          PART2="FLAME_CLIENT_BUILD_PART2.bin"
          PART3="FLAME_CLIENT_BUILD_PART3.bin"
          PART4="FLAME_CLIENT_BUILD_PART4.bin"

          for FILE in "$PART1" "$PART2" "$PART3" "$PART4"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file $FILE"
              exit 1
            fi
          done

          cat "$PART1" "$PART2" "$PART3" "$PART4" \
            > "$RUNNER_TEMP/FLAME_SOURCE.zip"

          echo "Checking ZIP..."

          unzip -t "$RUNNER_TEMP/FLAME_SOURCE.zip"

          mkdir -p "$RUNNER_TEMP/FLAME_SOURCE"

          unzip -oq "$RUNNER_TEMP/FLAME_SOURCE.zip" \
            -d "$RUNNER_TEMP/FLAME_SOURCE"

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SOURCE="$RUNNER_TEMP/FLAME_SOURCE"

          SETTINGS=$(find "$SOURCE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            echo "The source ZIP may be invalid."
            find "$SOURCE" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS")"

          echo "Found project: $PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FLAME Launcher
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Gradle project:"
          pwd

          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/FLAME_APK"

          find "$PROJECT_ROOT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -exec cp {} "$RUNNER_TEMP/FLAME_APK/" \;

          if [ -z "$(ls -A "$RUNNER_TEMP/FLAME_APK")" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/FLAME_APK"

      - name: Upload FLAME Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-Launcher-APK
          path: ${{ runner.temp }}/FLAME_APK/*.apk
          if-no-files-found: error
