
name: Build FLAME Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Download Android Command Line Tools
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK/cmdline-tools/latest"
          mv cmdline-tools/* "$SDK/cmdline-tools/latest/"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Verify SDK Manager
        run: |
          test -f "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$RUNNER_TEMP/android-sdk" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --sdk_root="$RUNNER_TEMP/android-sdk" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching Android project..."

          PROJECT="$GITHUB_WORKSPACE"

          if [ ! -f "$PROJECT/settings.gradle" ] && \
             [ ! -f "$PROJECT/settings.gradle.kts" ]; then

            SETTINGS=$(find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle was not found."
              echo "Repository contents:"
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "FLAME_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$FLAME_PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          APK=$(find "$FLAME_PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flame-artifact"

          cp "$APK" \
            "$RUNNER_TEMP/flame-artifact/FLAME_LAUNCHER.apk"

          ls -lh "$RUNNER_TEMP/flame-artifact/FLAME_LAUNCHER.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-LAUNCHER-APK
          path: ${{ runner.temp }}/flame-artifact/FLAME_LAUNCHER.apk
          if-no-files-found: error
          retention-days: 14
