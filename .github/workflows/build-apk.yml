name: Build FLAME CLIENT APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Locate FLAME CLIENT project
    shell: bash
    run: |
      set -euo pipefail
      echo "Repository root:"
      pwd
      find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print

      ROOT="$(find . -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"

      if [ -z "$ROOT" ]; then
        echo "::error::Cannot find Gradle project root."
        exit 1
      fi

      echo "Project root: $ROOT"
      echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

  - name: Build FLAME CLIENT APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_ROOT"

      if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
        echo "::error::Cannot find app/build.gradle or app/build.gradle.kts."
        exit 1
      fi

      gradle --no-daemon assembleDebug

  - name: Upload FLAME CLIENT APK
    uses: actions/upload-artifact@v4
    with:
      name: FLAME_CLIENT-debug-APK
      path: "**/app/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
      retention-days: 7
```
