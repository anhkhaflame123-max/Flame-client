
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Sử dụng Android SDK có sẵn trên GitHub Runner.
      # Không dùng android-actions/setup-android@v3 vì lỗi package "tools".
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      # Giữ nguyên danh sách SDK bro đã yêu cầu.
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate FLAME CLIENT project and merge packs
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for FLAME CLIENT project ZIP..."

          PROJECT_ZIP="$(find . -maxdepth 2 -type f \
            -iname 'FLAME_CLIENT_v2.3_PART1_PROJECT*.zip' \
            -print | head -n 1)"

          PACKS_ZIP="$(find . -maxdepth 2 -type f \
            -iname 'FLAME_CLIENT_v2.3_PART2_LARGE_PACKS*.zip' \
            -print | head -n 1)"

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERROR: Cannot find FLAME_CLIENT_v2.3_PART1_PROJECT ZIP"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          if [ -z "$PACKS_ZIP" ]; then
            echo "ERROR: Cannot find FLAME_CLIENT_v2.3_PART2_LARGE_PACKS ZIP"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Project ZIP: $PROJECT_ZIP"
          echo "Packs ZIP: $PACKS_ZIP"

          mkdir -p _flame_project _flame_packs
          unzip -q "$PROJECT_ZIP" -d _flame_project
          unzip -q "$PACKS_ZIP" -d _flame_packs

          # Tìm thư mục Gradle root dựa trên settings.gradle(.kts).
          SETTINGS_FILE="$(find _flame_project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: ZIP project does not contain settings.gradle or settings.gradle.kts"
            find _flame_project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: app folder not found under $PROJECT_ROOT"
            find "$PROJECT_ROOT" -maxdepth 4 -type d -print
            exit 1
          fi

          # Copy project files into the GitHub workspace root.
          cp -a "$PROJECT_ROOT"/. .

          # Locate the large packs directory in Part 2.
          PACKS_SOURCE="$(find _flame_packs -type d -name packs -print \
            | head -n 1 || true)"

          if [ -z "$PACKS_SOURCE" ]; then
            echo "ERROR: Cannot find a directory named packs in Part 2 ZIP"
            find _flame_packs -maxdepth 5 -print
            exit 1
          fi

          mkdir -p app/src/main/assets/packs
          cp -a "$PACKS_SOURCE"/. app/src/main/assets/packs/

          echo "Merged packs:"
          find app/src/main/assets/packs -type f -print | head -n 50

          PACK_COUNT="$(find app/src/main/assets/packs -type f | wc -l)"
          if [ "$PACK_COUNT" -eq 0 ]; then
            echo "ERROR: No pack files were copied"
            exit 1
          fi

          echo "PACK_COUNT=$PACK_COUNT" >> "$GITHUB_ENV"

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file missing at workspace root"
            ls -la
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory missing at workspace root"
            ls -la
            exit 1
          fi

          echo "Gradle project located successfully."
          ls -la
          ls -la app

      - name: Build FLAME CLIENT APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK and packs
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK size:"
          du -h "$APK"

          echo "Checking packed assets..."
          unzip -l "$APK" | grep 'assets/packs/' | head -n 50 || true

          APK_PACK_COUNT="$(unzip -Z1 "$APK" \
            | grep -c '^assets/packs/' || true)"

          if [ "$APK_PACK_COUNT" -eq 0 ]; then
            echo "ERROR: APK does not contain assets/packs/"
            exit 1
          fi

          echo "APK contains $APK_PACK_COUNT entries under assets/packs/"

      - name: Upload FLAME CLIENT APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-v2.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
